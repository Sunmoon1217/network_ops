# 配置分工：根 .env 给 compose 插值，envs/*.env 给进程，envs/secrets/* 给凭据。
# 变量分层见 envs/README.md；部署与排障见 handbook/deploy.md 与 entrypoint/README.md。

name: network_ops

x-secrets: &db-secrets
  - db_user
  - db_password

# app / worker 需要数据库凭据 + 阿里云 API 凭据
x-app-secrets: &app-secrets
  - db_user
  - db_password
  - prod_ak
  - prod_sk
  - test_ak
  - test_sk

# 四个应用进程共用 venv 镜像，代码由 code-init 铺进 code 卷（跨沙箱只传镜像）。
x-app-base: &app-base
  image: ${VENV_IMAGE:-network-ops-venv:latest}
  init: true
  # environment 优先于 env_file，可盖掉 envs/container.env 的同名值
  environment:
    DJANGO_ENV: ${DJANGO_ENV:-container}

services:
  # 初始化代码卷（一次性）：从 code 镜像复制代码到命名卷
  code-init:
    container_name: netops-codeinit
    image: ${CODE_IMAGE:?请在 .env 设置 CODE_IMAGE，如 network-ops-code:<git-sha>}
    init: true
    entrypoint: ["/opt/netops/code/entrypoint/code_init.sh"]
    volumes:
      - code:/app
      - static:/static
    restart: "no"
    networks:
      - internal

  # 数据库后端由根 .env 的 DB_SERVICE 选模板（compose.db.yml）；最终只有一个 db 服务
  db:
    extends:
      file: compose.db.yml
      service: ${DB_SERVICE:-postgresql}

  redis:
    image: redis:8.8.0
    container_name: netops-redis
    restart: unless-stopped
    init: true
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *app-base
    container_name: netops-app
    restart: unless-stopped
    entrypoint: ["/app/entrypoint/app.sh"]
    env_file:
      - envs/common.env
      - envs/gunicorn.env
      - envs/db.env
      - envs/container.env
    secrets: *app-secrets
    volumes:
      - code:/app:ro
      - repo:/configs
      - data:/data
      # 大屏链路配置：只读 bind，改 JSON + refresh_link_cache 即生效，重跑 code-init 不覆盖
      - ./conf:/etc/netops/conf:ro
    depends_on:
      code-init:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal

  worker:
    <<: *app-base
    container_name: netops-worker
    restart: unless-stopped
    entrypoint: ["/app/entrypoint/worker.sh"]
    env_file:
      - envs/common.env
      - envs/celery.env
      - envs/db.env
      - envs/container.env
    secrets: *app-secrets
    volumes_from:
      - app:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - internal

  # 访问流单写者消费者：只能跑一个实例（消费者组会摊消息，多实例即多写者）。
  # 判活看 Redis 的 access_flow:heartbeat（TTL 300s）。
  consumer:
    <<: *app-base
    container_name: netops-consumer
    restart: unless-stopped
    entrypoint: ["/app/entrypoint/consumer.sh"]
    env_file:
      - envs/common.env
      - envs/db.env
      - envs/container.env
    secrets: *db-secrets
    volumes_from:
      - app:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - internal

  # beat：单实例，周期投递大屏三条链；启动钩子见 entrypoint/beat.sh。
  beat:
    <<: *app-base
    container_name: netops-beat
    restart: unless-stopped
    entrypoint: ["/app/entrypoint/beat.sh"]
    env_file:
      - envs/common.env
      - envs/celery.env
      - envs/db.env
      - envs/container.env
    secrets: *app-secrets
    volumes_from:
      - app:ro
    depends_on:
      code-init:
        condition: service_completed_successfully
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.31-alpine
    container_name: netops-nginx
    restart: unless-stopped
    init: true
    ports:
      - "${NGINX_PORT:-8000}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.d/05-netops-resolver.sh:/docker-entrypoint.d/05-netops-resolver.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 --noproxy '*' -o /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  # 两个后端各一套数据卷（extends 模板里只引用其中一个；未引用到的不会被创建）
  postgres_data:
    driver: local
    name: network-ops-pgdata
  mysql_data:
    driver: local
    name: network-ops-mysqldata
  redis_data:
    driver: local
    name: network-ops-redis
  code:
    driver: local
    name: network-ops-code
  # 配置仓库（git，每台设备一个独立仓库）：app 写入 / worker 读取，纯内部数据用命名卷
  repo:
    driver: local
    name: network-ops-configrepo
  # 配置源目录：bind 宿主机 data 目录；首次部署先 mkdir -p data（目录不存在 up 会失败）
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data
    name: network-ops-extradata
  static:
    driver: local
    name: network-ops-static

secrets:
  db_user:
    file: ${DB_USER_SECRET_FILE:-./envs/secrets/db_user}
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-./envs/secrets/db_password}
  prod_ak:
    file: ${ALIYUN_PROD_ACCESS_KEY_ID_SECRET_FILE:-./envs/secrets/prod_ak}
  prod_sk:
    file: ${ALIYUN_PROD_ACCESS_KEY_SECRET_SECRET_FILE:-./envs/secrets/prod_sk}
  test_ak:
    file: ${ALIYUN_TEST_ACCESS_KEY_ID_SECRET_FILE:-./envs/secrets/test_ak}
  test_sk:
    file: ${ALIYUN_TEST_ACCESS_KEY_SECRET_SECRET_FILE:-./envs/secrets/test_sk}
