# 变量按「谁读」分三处（根 .env 给 compose 插值 / envs/*.env 按层注入 / envs/secrets/* 给凭据）：envs/README.md
# envs/*.env 三层：common.env（共享值）+ container.env（容器差异，排最后生效）+ 服务级（gunicorn/celery）；
# 宿主直跑读同一份 common.env + host.env（settings/base.py 启动时加载）——只维护一套配置。
# 部署与排障：docker/README.md §5；项目自身的约定：AGENTS.md「关键约定」

name: network_ops

x-secrets: &db-secrets
  - db_user
  - db_password

# app / worker 需要数据库凭据 + 阿里云 API 凭据（aliyun SDK 调用）
x-app-secrets: &app-secrets
  - db_user
  - db_password
  - aliyun_prod_access_key_id
  - aliyun_prod_access_key_secret
  - aliyun_test_access_key_id
  - aliyun_test_access_key_secret

# app / worker / consumer 用 venv 镜像 + 从 code 镜像挂载代码（跨沙箱传输场景）。
# 代码镜像（Dockerfile.code，busybox + 代码）由内网开发机构建后 scp 到服务器，
# 服务器 docker load 后，compose 直接从 code 镜像挂载 /app 到 venv 容器（不 docker cp）。
x-app-base: &app-base
  image: ${VENV_IMAGE:-network-ops-venv:latest}
  init: true

# 四个应用进程共用：数据库后端跟随根 .env 的 DB_SERVICE（容器里覆盖 envs/common.env 的
# DB_ENGINE，宿主直跑则直接读 common.env）。库名同样从 DB_NAME 嵌套下来，避免和 db 容器
# 各自一份值。端口刻意不在这里给——settings/base.py 按引擎取默认（postgresql 5432 / mysql 3306），
# 少一个必须同步的变量。
x-db-env: &db-env
  DB_ENGINE: "${DB_SERVICE:-postgresql}"
  DB_NAME: "${DB_NAME:-netops}"

services:
  # 初始化代码卷（一次性）：从 code 镜像复制代码到命名卷
  code-init:
    container_name: netops-codeinit
    image: ${CODE_IMAGE:?请在 .env 设置 CODE_IMAGE，如 network-ops-code:<git-sha>}
    init: true
    entrypoint: ["/opt/netops/code/entrypoint/code_init.sh"]
    volumes:
      - code:/app
      - static:/static
    restart: "no"
    networks:
      - internal

  # 数据库：具体用哪个后端由根 .env 的 DB_SERVICE 决定（模板见 compose.db.yml）。
  # 只有 `db` 这一个服务——模板不会变成服务，所以 up 只起一个库。
  db:
    extends:
      file: compose.db.yml
      service: ${DB_SERVICE:-postgresql}

  redis:
    image: redis:8.8.0
    container_name: netops-redis
    restart: unless-stopped
    init: true
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *app-base
    container_name: netops-app
    restart: unless-stopped
    entrypoint: ["/app/entrypoint/app.sh"]
    env_file:
      - envs/common.env
      - envs/gunicorn.env
      - envs/container.env
    secrets: *app-secrets
    environment: *db-env
    volumes:
      - code:/app:ro
      - repo:/configs
      - data:/data
      # 大屏链路配置：宿主 conf/ 只读挂进容器，改 JSON + refresh_link_cache 即生效，
      # 不进 code 卷，所以重跑 code-init / 重建容器都不会覆盖它。
      - ./conf:/etc/netops/conf:ro
    depends_on:
      code-init:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal

  worker:
    <<: *app-base
    container_name: netops-worker
    restart: unless-stopped
    entrypoint: ["/app/entrypoint/worker.sh"]
    env_file:
      - envs/common.env
      - envs/celery.env
      - envs/container.env
    secrets: *app-secrets
    environment: *db-env
    volumes_from:
      - app:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - internal

  # 访问流（AccessFlow）的单写者消费者：**只能跑一个实例**（消费者组会把消息摊给多个成员，多一个
  # 就是多写者，「先查后合并」的前提就没了；不要靠 scale 起多份）。
  # 心跳键 access_flow:heartbeat 由消费循环每轮盖章（TTL 300s），healthcheck 据此判活。
  consumer:
    <<: *app-base
    container_name: netops-consumer
    restart: unless-stopped
    entrypoint: ["/app/entrypoint/consumer.sh"]
    env_file:
      - envs/common.env
      - envs/container.env
    secrets: *db-secrets
    environment: *db-env
    volumes_from:
      - app:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - internal

  # 大屏链路缓存：beat 按期投递 ingest.refresh_link_cache，采集仍由 worker 执行。
  # 启动时先同步刷一次（entrypoint/beat.sh），避免 Redis 空导致大屏首屏空白；
  # volumes_from 继承 app 的 code / repo / data / conf 卷，--schedule 写 /tmp 避开只读 code 卷。
  beat:
    <<: *app-base
    container_name: netops-beat
    restart: unless-stopped
    entrypoint: ["/app/entrypoint/beat.sh"]
    env_file:
      - envs/common.env
      - envs/celery.env
      - envs/container.env
    secrets: *app-secrets
    environment: *db-env
    volumes_from:
      - app:ro
    depends_on:
      code-init:
        condition: service_completed_successfully
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.31-alpine
    container_name: netops-nginx
    restart: unless-stopped
    init: true
    ports:
      - "${NGINX_PORT:-8000}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.d/05-netops-resolver.sh:/docker-entrypoint.d/05-netops-resolver.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 --noproxy '*' -o /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  # 两个后端各一套数据卷（extends 模板里只引用其中一个；未引用到的不会被创建）
  postgres_data:
    driver: local
    name: network-ops-pgdata
  mysql_data:
    driver: local
    name: network-ops-mysqldata
  redis_data:
    driver: local
    name: network-ops-redis
  code:
    driver: local
    name: network-ops-code
  # 配置仓库（git，每台设备一个独立仓库）：app 写入 / worker 读取，纯内部数据用命名卷
  repo:
    driver: local
    name: network-ops-configrepo
  # 配置源目录：绑定宿主机 data 目录（运维放配置原文的地方，宿主可见）
  # ⚠ device 必须绝对路径（${PWD} = 运行 compose 的目录）；宿主目录不存在时 up 直接失败
  #   → 首次部署先 mkdir -p data；同名卷已存在时 driver_opts 被静默忽略（换绑定点要先 docker volume rm）
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data
    name: network-ops-extradata
  static:
    driver: local
    name: network-ops-static

secrets:
  db_user:
    file: ${DB_USER_SECRET_FILE:-./envs/secrets/db_user}
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-./envs/secrets/db_password}
  aliyun_prod_access_key_id:
    file: ${ALIYUN_PROD_ACCESS_KEY_ID_SECRET_FILE:-./envs/secrets/aliyun_prod_access_key_id}
  aliyun_prod_access_key_secret:
    file: ${ALIYUN_PROD_ACCESS_KEY_SECRET_SECRET_FILE:-./envs/secrets/aliyun_prod_access_key_secret}
  aliyun_test_access_key_id:
    file: ${ALIYUN_TEST_ACCESS_KEY_ID_SECRET_FILE:-./envs/secrets/aliyun_test_access_key_id}
  aliyun_test_access_key_secret:
    file: ${ALIYUN_TEST_ACCESS_KEY_SECRET_SECRET_FILE:-./envs/secrets/aliyun_test_access_key_secret}
