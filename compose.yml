# 变量按「谁读」分三处（根 .env 给 compose 插值 / env/*.env 按服务注入 / env/secrets/* 给凭据）：env/README.md
# 部署与排障：docker/README.md §5；项目自身的约定：AGENTS.md「关键约定」

name: network_ops

x-secrets: &db-secrets
  - postgres_user
  - postgres_password

# app / worker 需要数据库凭据 + 阿里云 API 凭据（aliyun SDK 调用）
x-app-secrets: &app-secrets
  - postgres_user
  - postgres_password
  - aliyun_prod_access_key_id
  - aliyun_prod_access_key_secret
  - aliyun_test_access_key_id
  - aliyun_test_access_key_secret

secrets:
  postgres_user:
    file: ${POSTGRES_USER_SECRET_FILE:-./env/secrets/postgres_user}
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./env/secrets/postgres_password}
  aliyun_prod_access_key_id:
    file: ${ALIYUN_PROD_ACCESS_KEY_ID_SECRET_FILE:-./env/secrets/aliyun_prod_access_key_id}
  aliyun_prod_access_key_secret:
    file: ${ALIYUN_PROD_ACCESS_KEY_SECRET_SECRET_FILE:-./env/secrets/aliyun_prod_access_key_secret}
  aliyun_test_access_key_id:
    file: ${ALIYUN_TEST_ACCESS_KEY_ID_SECRET_FILE:-./env/secrets/aliyun_test_access_key_id}
  aliyun_test_access_key_secret:
    file: ${ALIYUN_TEST_ACCESS_KEY_SECRET_SECRET_FILE:-./env/secrets/aliyun_test_access_key_secret}

# app / worker / consumer 用 venv 镜像 + 从 code 镜像挂载代码（跨沙箱传输场景）。
# 代码镜像（Dockerfile.code，busybox + 代码）由内网开发机构建后 scp 到服务器，
# 服务器 docker load 后，compose 直接从 code 镜像挂载 /app 到 venv 容器（不 docker cp）。
x-app-base: &app-base
  image: ${VENV_IMAGE:-network-ops-venv:latest}
  init: true

services:
  # 初始化代码卷（一次性）：从 code 镜像复制代码到命名卷
  code-init:
    image: ${CODE_IMAGE:-network-ops-code:latest}
    init: true
    volumes:
      - code_data:/opt/netops/code
    command: ["sh", "-c", "cp -a /app/. /opt/netops/code/ && echo 'code initialized'"]
    restart: "no"

  db:
    image: timescale/timescaledb:2.27.1-pg16
    container_name: netops-db
    restart: unless-stopped
    init: true
    env_file:
      - env/db.env
    secrets: *db-secrets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d \"$${POSTGRES_DB:-netops}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.0
    container_name: netops-redis
    restart: unless-stopped
    init: true
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *app-base
    container_name: netops-app
    restart: unless-stopped
    entrypoint: ["/app/netops-entrypoint"]
    env_file:
      - env/app.env
      - env/gunicorn.env
    secrets: *app-secrets
    volumes:
      - code_data:/app:ro
      - config_repo_data:/app/data/config_repo
      - type: bind
        source: ./data/configs
        target: /app/data/configs
        read_only: true
        bind:
          create_host_path: false
      - static_data:/var/lib/netops-static
    depends_on:
      code-init:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal

  worker:
    <<: *app-base
    container_name: netops-worker
    restart: unless-stopped
    entrypoint: ["/app/worker-entrypoint"]
    env_file:
      - env/app.env
      - env/celery.env
    secrets: *app-secrets
    volumes_from:
      - app:ro
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal

  # 访问流（AccessFlow）的单写者消费者：**只能跑一个实例**（消费者组会把消息摊给多个成员，多一个
  # 就是多写者，「先查后合并」的前提就没了；不要靠 scale 起多份）。
  # 心跳键 access_flow:heartbeat 由消费循环每轮盖章（TTL 300s），healthcheck 据此判活。
  consumer:
    <<: *app-base
    container_name: netops-consumer
    restart: unless-stopped
    entrypoint: ["/app/consumer-entrypoint"]
    env_file:
      - env/app.env
    secrets: *db-secrets
    volumes_from:
      - app:ro
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - internal

  nginx:
    image: nginx:1.31-alpine
    container_name: netops-nginx
    restart: unless-stopped
    init: true
    ports:
      - "${NGINX_PORT:-8000}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.d/05-netops-resolver.sh:/docker-entrypoint.d/05-netops-resolver.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_data:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 --noproxy '*' -o /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  code_data:
    driver: local
  config_repo_data:
    driver: local
  static_data:
    driver: local
