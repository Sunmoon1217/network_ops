# MySQL 8.4 后端覆盖层：与主 compose 叠加使用
#
#   docker compose -f compose.yml -f compose.mysql.yml up -d
#
# 只覆盖 db 服务与四个应用进程的数据库旋钮；redis / code-init / nginx 的编排完全不变。
# 为什么单独一层而不是在 compose.yml 里堆条件：compose 没法按变量切换 image、healthcheck、
# 数据目录与端口映射，覆盖层是唯一能让「两个后端各自一眼看懂」的写法。
#
# 与 PostgreSQL 的差异（运维需要知道的）：
#   * 数据目录 /var/lib/mysql，卷名 network-ops-mysqldata（与 postgres_data 互不干扰）；
#   * 官方 mysql 镜像**没有** MYSQL_USER_FILE，用户名只能走环境变量（它不是秘密）；
#     密码仍走 secrets，与 PG 共用 db_user / db_password——两个后端同一套轮换流程；
#   * 8.4 默认 caching_sha2_password，mysqlclient 由 libmariadb3 自带的插件支持，
#     不需要额外启动参数；
#   * MySQL 的 DDL 不能回滚，迁移失败会留下半套 schema（见 handbook/deploy.md）。
#   * ⚠️ 幂等：切换后端就是换一套数据卷。同一个 POSTGRES_DB 名下不要指望 PG 的数据能复用。

name: network_ops

# 四个应用进程共用的数据库旋钮：换后端只改这里，不去动 envs/common.env
# （common.env 是 PG 与 MySQL 两种部署共用的文件，POSTGRES_PORT=5432 在 MySQL 下必须覆盖成 3306）。
x-mysql-db-env: &mysql-db-env
  DB_ENGINE: mysql
  POSTGRES_PORT: "3306"

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4-oracle}
    container_name: netops-db
    restart: unless-stopped
    init: true
    # 显式钉住字符集与排序规则：默认已是 utf8mb4 / utf8mb4_0900_ai_ci，写出来是为了让
    # 「大小写不敏感的唯一键」这个跨库差异在配置里可见，而不是靠镜像默认值。
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${POSTGRES_DB:-netops}
      # 必须与 envs/secrets/db_user 的内容一致（官方镜像不支持 MYSQL_USER_FILE）
      MYSQL_USER: ${MYSQL_USER:-netops}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
    # !override：清掉基础层的 postgres 端口映射 / 数据卷 / db_user 密钥，
    # 否则会同时保留 5432→5432 与 /var/lib/postgresql/data 两个挂载。
    ports: !override
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes: !override
      - mysql_data:/var/lib/mysql
    secrets: !override
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/db_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    environment: *mysql-db-env
  worker:
    environment: *mysql-db-env
  consumer:
    environment: *mysql-db-env
  beat:
    environment: *mysql-db-env

volumes:
  mysql_data:
    driver: local
    name: network-ops-mysqldata
