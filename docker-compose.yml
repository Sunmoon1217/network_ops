name: network_ops

# app 与 worker 共用同一镜像与环境，用锚点避免两处写法漂移
x-app-environment: &app-environment
  POSTGRES_DB: ${POSTGRES_DB:-netops}
  POSTGRES_USER: ${POSTGRES_USER:-netops}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netops_password}
  # 容器内走 compose 网络，固定用服务名与容器端口；
  # 注意这与 db 服务对外映射的 ${POSTGRES_PORT}（宿主端口）是两回事，
  # 宿主端口改了也不影响容器内连接。
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}

services:
  db:
    image: timescale/timescaledb:2.27.1-pg16
    container_name: netops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netops}
      POSTGRES_USER: ${POSTGRES_USER:-netops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netops_password}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.0
    container_name: netops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django / ASGI 应用。镜像内的静态产物经命名卷交给 nginx（见 Dockerfile.app）
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: network-ops:latest
    container_name: netops-app
    restart: unless-stopped
    environment: *app-environment
    volumes:
      # 配置仓库（GitPython 操作的 git 仓库）与上传，必须持久化
      - app_data:/app/data
      # 下面两个是「镜像产物的出口」，供 nginx 通过同名卷读取。
      # 挂载点是镜像里**故意留空的目录**，卷里内容只由 entrypoint 启动时从
      # /app/www、/app/frontend/dist 复制进来——不用 /app/www 本身当挂载点，
      # 是为了避免卷遮住镜像内容后「Docker 只播种一次」带来的陈旧问题。
      - www_data:/var/lib/netops-static/www
      - dist_data:/var/lib/netops-static/dist
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 不映射到宿主端口：统一走 nginx 入口。调试见 docker/README 或
    #   docker compose exec app python manage.py shell
    expose:
      - "8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Celery worker：采集→解析→存储是异步阶段任务，没有 worker 时
  # 上游 .delay() 只会把消息堆在 Redis 里、永远不执行。
  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: network-ops:latest
    container_name: netops-worker
    restart: unless-stopped
    environment: *app-environment
    command: ["celery", "-A", "netops", "worker", "--loglevel=info"]
    volumes:
      # 阶段任务要读写 data/config_repo，必须与 app 共享同一个卷
      - app_data:/app/data
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.31-alpine
    container_name: netops-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 两个静态产物卷由 app 容器写入（镜像内构建 + entrypoint 同步），nginx 只读。
      # 不再 bind mount 宿主机目录，所以宿主机不需要 node/pnpm，也不需要在发版前
      # 手工跑 pnpm build / collectstatic。
      - dist_data:/usr/share/nginx/html:ro
      - www_data:/usr/share/nginx/static:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # 配置仓库与运行期数据（必须持久化）
  app_data:
    driver: local
  # 静态产物（可由重建镜像恢复，属于可丢弃数据）
  www_data:
    driver: local
  dist_data:
    driver: local
