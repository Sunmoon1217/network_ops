# 变量按「谁读」分三处（根 .env 给 compose 插值 / env/*.env 按服务注入 / env/secrets/* 给凭据）：env/README.md
# 部署与排障：docker/README.md §5；项目自身的约定：AGENTS.md「关键约定」

name: network_ops

x-secrets: &db-secrets
  - postgres_user
  - postgres_password

secrets:
  postgres_user:
    file: ${POSTGRES_USER_SECRET_FILE:-./env/secrets/postgres_user}
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./env/secrets/postgres_password}

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile.app
  args:
    BASE_IMAGE: ${BASE_IMAGE:-network-ops-base:py312}

services:
  db:
    image: timescale/timescaledb:2.27.1-pg16
    container_name: netops-db
    restart: unless-stopped
    env_file:
      - env/db.env
    secrets: *db-secrets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d \"$${POSTGRES_DB:-netops}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.0
    container_name: netops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: *app-build
    image: network-ops:latest
    container_name: netops-app
    restart: unless-stopped
    env_file:
      - env/app.env
      - env/gunicorn.env
    secrets: *db-secrets
    volumes:
      - config_repo_data:/app/data/config_repo
      - type: bind
        source: ./data/configs
        target: /app/data/configs
        read_only: true
        bind:
          create_host_path: false
      - static_data:/var/lib/netops-static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build: *app-build
    image: network-ops:latest
    container_name: netops-worker
    restart: unless-stopped
    env_file:
      - env/app.env
      - env/celery.env
    entrypoint: ["/bin/sh", "-c"]
    # 同时消费主队列与 access_flow 队列（settings 的 CELERY_TASK_ROUTES）。两条链都是
    # 低频、毫秒~秒级，共享并发槽的最坏代价是秒级排队——比为每个可能堵的队列各开一个
    # 677MB 的 prefork 池便宜得多；真出现主链被饿死的实测证据再拆出独立服务即可。
    # --concurrency=2 写死：默认池按 CPU 核数起（16 核 = 16 子进程 × 81M，空载即爆炸），
    # 且同设备并发入库会写坏数据（见 AGENTS.md），2 保留跨设备并行、压缩同设备撞车窗口。
    command: ["exec celery -A netops worker -Q celery,access_flow --concurrency=2 --loglevel=\"$${CELERY_LOGLEVEL:-info}\""]
    secrets: *db-secrets
    volumes:
      - config_repo_data:/app/data/config_repo
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "celery -A netops inspect ping -d \"celery@$$HOSTNAME\" --timeout 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 访问流（AccessFlow）的单写者消费者：**只能跑一个实例**（消费者组会把消息摊给多个成员，多一个
  # 就是多写者，「先查后合并」的前提就没了；不要靠 scale 起多份）。
  # 心跳键 access_flow:heartbeat 由消费循环每轮盖章（TTL 300s），healthcheck 据此判活。
  access-flow-consumer:
    build: *app-build
    image: network-ops:latest
    container_name: netops-access-flow-consumer
    restart: unless-stopped
    env_file:
      - env/app.env
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec python manage.py access_flow_consumer"]
    secrets: *db-secrets
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys,redis; r=redis.Redis(host=os.environ.get('REDIS_HOST','localhost'),port=int(os.environ.get('REDIS_PORT',6379)),password=os.environ.get('REDIS_PASSWORD') or None); sys.exit(time.time()-float(r.get('access_flow:heartbeat') or 0)>=120)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.31-alpine
    container_name: netops-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/docker-entrypoint.d/05-netops-resolver.sh:/docker-entrypoint.d/05-netops-resolver.sh:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_data:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 3 --noproxy '*' -o /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  config_repo_data:
    driver: local
  static_data:
    driver: local
