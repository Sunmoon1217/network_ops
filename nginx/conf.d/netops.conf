# 网络运维平台 nginx 主配置：静态资源直出，/api、/admin、/media、/mcp 反代 app。
# 静态卷按 URL 前缀布局，一个 server 级 root 覆盖全部静态请求；双入口（大屏）与
# resolver 推导的完整说明见 handbook/deploy.md。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 变量式 upstream + 启动时生成的 resolver：app 重建后无需 reload，Podman / Docker 都能解析。
    # 生成逻辑见 docker-entrypoint.d/05-netops-resolver.sh。
    include /etc/nginx/netops/resolver.conf;
    set $netops_upstream "app:8000";

    # 静态卷挂载点（docker-compose 把 static_data 挂到这里；卷内还含 static/ 子目录）
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 上传限制：设备 Excel 导入等场景
    client_max_body_size 100m;

    access_log /var/log/nginx/netops.access.log;
    error_log  /var/log/nginx/netops.error.log warn;

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # 代理通用参数（server 级，location 自动继承）
    proxy_http_version 1.1;
    # Host 必须用 $http_host（含端口）；$host 会丢端口，导致 CSRF Origin 校验 403。
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Connection        "";

    # 超时：路径追踪 / 配置解析等操作可能较慢
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # 动态请求：交给 Django
    location /api/ {
        proxy_pass http://$netops_upstream;
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass http://$netops_upstream;
    }

    location /media/ {
        proxy_pass http://$netops_upstream;
    }

    # MCP 端点（Streamable HTTP，可能是 SSE 长连接）：关缓冲、关 gzip、读写超时放到小时级，
    # 否则工具调用会 pending。不配这条时 /mcp 会落到 SPA 兜底。
    location /mcp {
        proxy_pass http://$netops_upstream;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header X-Accel-Buffering no;
    }

    # 静态资源：nginx 直接返回

    # collectstatic 产物（继承 server 级 root，/static/x → <root>/static/x）
    location /static/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Vue 构建产物：文件名带内容 hash，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # 两个 Vite 入口都不缓存，保证发版后立即生效（assets 文件名带 hash，可长期缓存）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 大屏是第二个 Vite 入口，必须单独接管；落到 SPA 兜底会白屏。
    location = /dashboard.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 友好 URL：内部重定向到 /dashboard.html（继承上面的 no-cache）
    location = /dashboard {
        try_files /dashboard.html =404;
    }

    location = /dashboard/ {
        try_files /dashboard.html =404;
    }

    # 根路径 302 到大屏；主站入口在 /overview，与 Django / vite dev 一致。
    location = / {
        return 302 /dashboard;
    }

    # SPA 兜底：先找真实文件，找不到交给主站 Vue Router（不要改成 dashboard.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
