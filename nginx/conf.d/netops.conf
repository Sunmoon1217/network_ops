# 网络运维平台 - nginx 主配置
#
# 架构：
#   静态资源（两类构建产物） → nginx 直接返回
#   动态请求（/api 等）      → 反向代理到 app 容器
#
#   client ──┬─▶ /assets/*  ──▶ /usr/share/nginx/html/assets/*  (Vue 构建产物)
#            ├─▶ /static/*  ──▶ /usr/share/nginx/static/*       (collectstatic 产物)
#            └─▶ /api/*     ──▶ app:8000                        (compose 里的 app 服务)
#
# 两类静态资源都来自 app 镜像（宿主机构建好后 COPY 进去），经**一个**命名卷挂到
# 本容器：卷内按 URL 前缀布局（index.html + assets/ + static/），所以下面只需一个
# server 级 root 就能覆盖 /、/assets/*、/static/*。
# app 容器的 entrypoint 每次启动把镜像里的产物复制进卷（docker-compose.yml 里
# nginx 只读挂载 static_data:/usr/share/nginx/html）。
#
# 若要让 nginx 指向宿主机上直接跑的 Django（不用 app 容器），把下面的
# $netops_upstream 改成 host.docker.internal:8000，并给 nginx 服务加回
#   extra_hosts: ["host.docker.internal:host-gateway"]

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 后端地址用「变量 + resolver」而不是 upstream 块，两个原因：
    #   1. upstream 只在启动时解析一次。app 容器重建后会拿到新 IP，nginx 仍旧
    #      指向旧 IP，表现是「重建 app 之后一直 502，直到 reload nginx」。
    #      变量形式让 nginx 按 valid 周期重新解析。
    #   2. 静态 upstream 一旦解析不到 app 就直接 emerg 退出，脱离 compose 网络
    #      连 nginx -t 都过不了；变量形式只在真正转发时才解析。
    #
    # resolver 的地址**不能写死**：Docker 是内置 DNS 127.0.0.11，而 Podman 是网络
    # 网关（如 10.89.3.1）——写死其中一个，另一种 runtime 上就会
    # `recv() failed (111: Connection refused) while resolving` + 502。
    # 所以由容器启动时从 /etc/resolv.conf 生成，见 docker-entrypoint.d/05-netops-resolver.sh。
    include /etc/nginx/netops/resolver.conf;
    set $netops_upstream "app:8000";

    # 静态卷挂载点（docker-compose 把 static_data 挂到这里；卷内还含 static/ 子目录）
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 上传限制：设备 Excel 导入等场景
    client_max_body_size 100m;

    access_log /var/log/nginx/netops.access.log;
    error_log  /var/log/nginx/netops.error.log warn;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- 代理通用参数（server 级，下方 location 自动继承）----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # 超时：路径追踪 / 配置解析等操作可能较慢
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ==================== 动态请求：交给 Django ====================

    location /api/ {
        proxy_pass http://$netops_upstream;
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass http://$netops_upstream;
    }

    location /media/ {
        proxy_pass http://$netops_upstream;
    }

    # ==================== 静态资源：nginx 直接返回 ====================

    # Django collectstatic 产物（admin 后台样式/脚本等）
    # 静态卷里按 URL 前缀布局（static/ 子目录），所以这里**不用**再写 root，
    # 继承 server 级的 root /usr/share/nginx/html 即可：/static/x → <root>/static/x
    location /static/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Vue 构建产物：文件名带内容 hash，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==================== SPA 兜底 ====================
    # 先找真实文件，找不到则交给 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
