# 网络运维平台 - nginx 主配置
#
# 架构：
#   静态资源（Vue 构建产物） → nginx 直接返回（挂载 frontend/dist）
#   动态请求（/api 等）      → 反向代理到宿主机 Django
#
#   client ──┬─▶ /assets/*  ──▶ /usr/share/nginx/html/assets/*  (Vue 构建产物)
#            ├─▶ /static/*  ──▶ /usr/share/nginx/static/*       (collectstatic 产物)
#            └─▶ /api/*     ──▶ host.docker.internal:8000       (宿主机 Django)
#
# 说明：Django 运行在宿主机（uv run python manage.py runserver），
#      容器访问宿主机依赖 docker-compose 中的
#      extra_hosts: "host.docker.internal:host-gateway"。

upstream netops_app {
    server host.docker.internal:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Vue 构建产物挂载点（docker-compose 挂载 ./frontend/dist 到此）
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 上传限制：设备 Excel 导入等场景
    client_max_body_size 100m;

    access_log /var/log/nginx/netops.access.log;
    error_log  /var/log/nginx/netops.error.log warn;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- 代理通用参数（server 级，下方 location 自动继承）----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # 超时：路径追踪 / 配置解析等操作可能较慢
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ==================== 动态请求：交给 Django ====================

    location /api/ {
        proxy_pass http://netops_app;
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass http://netops_app;
    }

    location /media/ {
        proxy_pass http://netops_app;
    }

    # ==================== 静态资源：nginx 直接返回 ====================

    # Django collectstatic 产物（admin 后台样式/脚本等）
    # 前置：uv run python manage.py collectstatic --noinput
    # 注意：STATIC_ROOT = BASE_DIR / "www"，已挂载到 /usr/share/nginx/static
    location /static/ {
        root /usr/share/nginx;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Vue 构建产物：文件名带内容 hash，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==================== SPA 兜底 ====================
    # 先找真实文件，找不到则交给 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
