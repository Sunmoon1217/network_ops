# 网络运维平台 - nginx 主配置
#
# 架构：
#   静态资源（两类构建产物） → nginx 直接返回
#   动态请求（/api 等）      → 反向代理到 app 容器
#
#   client ──┬─▶ /assets/*  ──▶ /usr/share/nginx/html/assets/*  (Vue 构建产物)
#            ├─▶ /static/*  ──▶ /usr/share/nginx/static/*       (collectstatic 产物)
#            └─▶ /api/*     ──▶ app:8000                        (compose 里的 app 服务)
#
# 两类静态资源都由 **app 镜像在构建期生成**，通过命名卷挂到本容器：
#   docker-compose.yml 里 nginx 只读挂载 dist_data / www_data，
#   app 容器的 entrypoint 每次启动把镜像里的产物同步进同名卷。
#   因此宿主机不需要 node/pnpm，也不必手工跑 pnpm build / collectstatic。
#
# 若要让 nginx 指向宿主机上直接跑的 Django（不用 app 容器），把下面的
# $netops_upstream 改成 host.docker.internal:8000，并给 nginx 服务加回
#   extra_hosts: ["host.docker.internal:host-gateway"]

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 后端地址用「变量 + resolver」而不是 upstream 块，两个原因：
    #   1. upstream 只在启动时解析一次。app 容器重建后会拿到新 IP，nginx 仍旧
    #      指向旧 IP，表现是「重建 app 之后一直 502，直到 reload nginx」。
    #      变量形式让 nginx 按 valid 周期重新解析。
    #   2. 静态 upstream 一旦解析不到 app 就直接 emerg 退出，脱离 compose 网络
    #      连 nginx -t 都过不了；变量形式只在真正转发时才解析。
    # 127.0.0.11 是 Docker 的内置 DNS（用户自定义 bridge 网络里可用）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $netops_upstream "app:8000";

    # Vue 构建产物挂载点（docker-compose 挂 dist_data 到此）
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 上传限制：设备 Excel 导入等场景
    client_max_body_size 100m;

    access_log /var/log/nginx/netops.access.log;
    error_log  /var/log/nginx/netops.error.log warn;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- 代理通用参数（server 级，下方 location 自动继承）----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # 超时：路径追踪 / 配置解析等操作可能较慢
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ==================== 动态请求：交给 Django ====================

    location /api/ {
        proxy_pass http://$netops_upstream;
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass http://$netops_upstream;
    }

    location /media/ {
        proxy_pass http://$netops_upstream;
    }

    # ==================== 静态资源：nginx 直接返回 ====================

    # Django collectstatic 产物（admin 后台样式/脚本等）
    # 前置：uv run python manage.py collectstatic --noinput
    # 注意：STATIC_ROOT = BASE_DIR / "www"，已挂载到 /usr/share/nginx/static
    location /static/ {
        root /usr/share/nginx;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Vue 构建产物：文件名带内容 hash，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==================== SPA 兜底 ====================
    # 先找真实文件，找不到则交给 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
