[project]
name = "network-ops"
version = "2.0.0"
description = "网络运维管理平台：Django REST 后端 + Vue 3 前端"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "aliyun-log-python-sdk>=0.9.52",
    "aliyun-python-sdk-asapi>=2.4.7.2",
    "aliyun-python-sdk-core>=2.16.1",
    "aliyun-python-sdk-ecs>=4.24.83",
    "aliyun-python-sdk-slb>=3.3.22",
    "aliyun-python-sdk-sls>=1.1.2",
    "aliyun-python-sdk-vpc>=3.0.48",
    "celery>=5.6.3",
    "django>=6.1",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "dnspython>=2.8.0",
    "gitpython>=3.1.61",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.12",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "ttp>=0.10.1",
    "uvicorn>=0.53.0",
    "uvicorn-worker>=0.4.0",
]

[tool.uv]
exclude-dependencies = ["aliyun-python-sdk-core-v3"]

[tool.django-stubs]
django_settings_module = "netops.settings"

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["F405", "F403", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["aliyun", "analysis", "assets", "core", "ingest"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]

# migrations 由 Django 自动生成（单引号风格，与既有迁移文件一致），不纳入 ruff format 检查
[tool.ruff.format]
exclude = ["**/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netops.settings"
testpaths = ["tests"]

# Pyrefly：比 mypy/pyright 快的类型检查器（Meta 开源，Rust 实现）。
# 关键是 search-path：项目把 core/ingest/assets/analysis/aliyun 放在 apps/ 下，
# 运行时由 netops/settings/__init__.py 把 apps/ 插进 sys.path，
# Pyrefly 不知道这层，不配 search-path 会把所有顶层 import 标成 missing-import。
[tool.pyrefly]
search-path = ["apps", "."]
project-includes = ["**/*.py*"]
project-excludes = [
    "**/migrations/*",
    "**/tests/*",
    ".venv/**",
    "frontend/**",
    "data/**",
    "tmp/**",
    "**/node_modules/**",
]

[tool.pyright]
include = ["apps"]
exclude = ["**/.*"]

[dependency-groups]
dev = [
    "celery-stubs>=0.1.3",
    "django-stubs>=6.1.0",
    "djangorestframework-stubs>=3.18.1",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]
