[project]
name = "network-ops"
version = "2.0.0"
description = "网络运维管理平台：Django REST 后端 + Vue 3 前端"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "aliyun-log-python-sdk>=0.9.52",
    "aliyun-python-sdk-asapi>=2.4.7.2",
    "aliyun-python-sdk-core>=2.16.1",
    "aliyun-python-sdk-ecs>=4.24.83",
    "aliyun-python-sdk-slb>=3.3.22",
    "aliyun-python-sdk-sls>=1.1.2",
    "aliyun-python-sdk-vpc>=3.0.48",
    "celery>=5.6.3",
    "django>=6.1",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "dnspython>=2.8.0",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.10.1",
    "gitpython>=3.1.61",
    "gunicorn>=26.2.0",
    "markdown>=3.11.2",
    "mcp>=2.3.0",
    "mysqlclient>=2.2.1",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "ttp>=0.10.1",
    "uvicorn>=0.53.0",
    "uvicorn-worker>=0.4.0",
    "zabbix-utils[async]==2.0.2",
]

[tool.uv]
exclude-dependencies = ["aliyun-python-sdk-core-v3"]

# [tool.pyrefly.errors]
# bad-override = "ignore"

[tool.django-stubs]
django_settings_module = "netops.settings"

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["F405", "F403", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["aliyun", "analysis", "assets", "core", "docs", "ingest", "llmtools", "netops"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]

# migrations 由 Django 自动生成（单引号风格，与既有迁移文件一致），不纳入 ruff format 检查
[tool.ruff.format]
exclude = ["**/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netops.settings"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["apps", "llmtools"]
extraPaths = ["apps"]
exclude = ["**/.*"]
reportIncompatibleVariableOverride = "none"

[tool.pyrefly]
site-packages-path = ["typings"]
search-path = ["apps", "."]
project-includes = ["apps", "llmtools"]
project-excludes = ["**/.*"]
infer-with-first-use = false


[dependency-groups]
dev = [
    "celery-stubs>=0.1.3",
    "django-stubs>=6.1.0",
    "djangorestframework-stubs>=3.18.1",
    "inflection>=0.5.1",
    "ipykernel>=7.3.0",
    "openpyxl-stubs>=0.1.25",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.5",
    "types-markdown>=3.11.2.20261029",
    "uritemplate>=4.2.0",
]
