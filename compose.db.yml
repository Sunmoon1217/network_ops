# 数据库后端模板：只被 compose.yml 的 db 服务 extends 引用，不能当 -f 传（否则两个库都会起）。
# 连接参数不在这里：envs/db.env 把 DB_* 嵌套成镜像认的 POSTGRES_* / MYSQL_*。
# extends 的三条硬约束与跨库差异见 handbook/deploy.md。
services:
  postgresql:
    image: ${DB_IMAGE_POSTGRES:-timescale/timescaledb:2.27.1-pg16}
    container_name: netops-db
    restart: unless-stopped
    init: true
    env_file:
      - envs/common.env
      - envs/db.env
    secrets:
      - db_user
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_POSTGRES:-5432}:5432"
    networks:
      - internal
    healthcheck:
      # -U 不能省：healthcheck 由 docker 以镜像默认用户 root 执行，不带会刷 role "root" does not exist
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/db_user)\" -d \"$${POSTGRES_DB:-netops}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: ${DB_IMAGE_MYSQL:-mysql:8.4-oracle}
    container_name: netops-db
    restart: unless-stopped
    init: true
    # 显式钉住字符集与排序规则（大小写不敏感的唯一键差异在配置里可见）
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    env_file:
      - envs/common.env
      - envs/db.env
      # 只为把 DJANGO_ENV 带进来（初始化脚本据此判断 prod 不授权测试库）
      - envs/container.env
    secrets:
      - db_password
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化时授予测试库权限；已有数据卷需手动执行，见 entrypoint/mysql_init.sh
      - ./entrypoint/mysql_init.sh:/docker-entrypoint-initdb.d/01-grant-test-db.sh:ro
    ports:
      - "${DB_PORT_MYSQL:-3306}:3306"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/db_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
